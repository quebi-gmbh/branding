<?xml version="1.0" encoding="UTF-8"?>
<!-- quebi · full lockup · DARK variant (quebi-wordmark-light).
     gray-50 knockout q badge + gray-50 "uebi". Single ink.
     Meant for dark grounds (#030712); the q cut-out reveals the ground.
     Badge x=0..100. The q is fitted to the type: "uebi" at 127.66 px makes the
     u stems exactly 9 (= q stroke); the bowl's outer edge spans the u's ink
     (y 19.36..80.64); the cut slot is the e's crossbar band (y 45.02..52.68).
     Values derive from scripts/outline.mjs → lockupGeometry.
     viewBox starts at y=-11.02 so the b ascender isn't clipped.

     Requires ./fonts/Outfit-Light.ttf OR outlining before export.
     See uebi-wordmark.svg for the font-face rationale. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 -11.02 344.89 111.02" width="344.89" height="111.02">
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 300;
        font-display: block;
        src: url("./fonts/Outfit-Light.ttf") format("truetype");
      }
      .uebi {
        font-family: "Outfit", "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 300;
        font-size: 127.66px;
        text-anchor: start;
      }
    ]]></style>
    <mask id="q-knockout-mask-d" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <g stroke="black" stroke-width="9" fill="none" stroke-linecap="round">
        <circle cx="50" cy="50" r="26.14"/>
        <line x1="76.14" y1="50" x2="76.14" y2="100"/>
      </g>
      <!-- cut slot kept as disc material (white = keep) -->
      <rect x="10" y="45.02" width="80" height="7.66" fill="white"/>
    </mask>
  </defs>

  <!-- knockout q badge -->
  <circle cx="50" cy="50" r="50" fill="#f9fafb" mask="url(#q-knockout-mask-d)"/>

  <!-- uebi wordmark — baseline y=79.36, letter origins 105.27/178.55/251.82/325.10 -->
  <text class="uebi" y="79.36" fill="#f9fafb">
    <tspan x="105.27">u</tspan>
    <tspan x="178.55">e</tspan>
    <tspan x="251.82">b</tspan>
    <tspan x="325.10">i</tspan>
  </text>
</svg>
